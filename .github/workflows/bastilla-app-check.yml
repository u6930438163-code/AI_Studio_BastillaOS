name: BastillaOS application verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/bastilla-app-check.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/bastilla-app-check.yml'
permissions:
  contents: read
jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: HTTP startup smoke test
        shell: bash
        env:
          NODE_ENV: production
          PORT: '3901'
        run: |
          set -euo pipefail
          npm run start > /tmp/bastilla-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3901/api/system/metrics > /tmp/bastilla-metrics.json; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 100 /tmp/bastilla-http.log || true
            echo 'HTTP startup test failed' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node -e 'const x=require("/tmp/bastilla-metrics.json"); if(typeof x.cpuPercent!=="number") process.exit(1); console.log("Metrics endpoint OK")'
          echo 'HTTP /api/system/metrics: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bastilla-http-startup-log
          path: /tmp/bastilla-http.log
          if-no-files-found: ignore
      - name: Verification summary
        if: always()
        run: |
          echo '### BastillaOS application checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow validates source, tests and frontend build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not prove the Ollama service, AI Studio, MCP, or QEMU guest are live.' >> "$GITHUB_STEP_SUMMARY"
