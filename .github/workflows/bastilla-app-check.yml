name: BastillaOS application verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/bastilla-app-check.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/bastilla-app-check.yml'
permissions:
  contents: read
jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: Verification summary
        if: always()
        run: |
          echo '### BastillaOS application checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow validates source, tests and frontend build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not prove the Ollama service, AI Studio, MCP, or QEMU guest are live.' >> "$GITHUB_STEP_SUMMARY"
