name: Bastilla OS MCP - deploy Cloudflare from main
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/mcp/**'
      - '.github/workflows/bastilla-cloudflare-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify MCP protocol, authorization and real-only data policy
        run: node --test cloudflare/mcp/worker.test.mjs

  deploy:
    needs: verify_mcp
    if: ${{ vars.BASTILLA_MCP_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload MCP Worker to Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_ACCOUNT_ID:?Configure GitHub Actions secret CLOUDFLARE_ACCOUNT_ID}"
          : "${CF_API_TOKEN:?Configure GitHub Actions secret CLOUDFLARE_API_TOKEN}"
          cat > /tmp/bastilla-worker-metadata.json <<'JSON'
          {"main_module":"worker.mjs","compatibility_date":"2026-11-01","keep_bindings":["secret_text","plain_text"]}
          JSON
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/bastilla-os-mcp" \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            --form "metadata=@/tmp/bastilla-worker-metadata.json;type=application/json" \
            --form "worker.mjs=@cloudflare/mcp/worker.mjs;type=application/javascript+module"
      - name: Check actual public Worker health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://bastilla-os-mcp.bastilla-u6930438163.workers.dev/health
