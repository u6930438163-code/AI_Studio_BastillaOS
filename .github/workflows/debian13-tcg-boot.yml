name: BastillaOS Debian 13 TCG boot verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debian13-tcg-boot.yml'
      - 'scripts/check-virtualization.sh'
permissions:
  contents: read
concurrency:
  group: bastilla-debian13-tcg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debian13-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils
      - name: Diagnose virtualization host
        shell: bash
        run: bash scripts/check-virtualization.sh | tee virtualization.log
      - name: Download official Debian 13 cloud image
        shell: bash
        run: |
          set -euo pipefail
          base=https://cloud.debian.org/images/cloud/trixie/latest
          image=debian-13-generic-amd64.qcow2
          curl -fL --retry 3 --connect-timeout 30 -o debian13.qcow2 "$base/$image"
          curl -fL --retry 3 --connect-timeout 30 -o SHA512SUMS "$base/SHA512SUMS"
          expected=$(awk -v image="$image" '$2 == image || $2 == "*" image {print $1; exit}' SHA512SUMS)
          if [[ ! "$expected" =~ ^[0-9a-fA-F]{128}$ ]]; then
            echo "FAIL: Official checksum not found for $image"; exit 1
          fi
          printf '%s  %s\n' "$expected" debian13.qcow2 | sha512sum --check --status
          echo "PASS: Official Debian 13 image SHA-512 checksum verified"
          qemu-img info debian13.qcow2
      - name: Boot Debian 13 with software emulation
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 240s qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -smp 2 -m 2048 \
            -drive file=debian13.qcow2,format=qcow2,if=virtio,snapshot=on \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:boot.log -monitor none -no-reboot || code=$?
          echo "QEMU exit code: ${code:-0}"
          echo "### BastillaOS Debian 13 boot test" >> "$GITHUB_STEP_SUMMARY"
          echo "- QEMU exit code: ${code:-0}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 boot.log || true
          if [[ "${code:-0}" != "0" && "${code:-0}" != "124" ]]; then
            echo "FAIL: QEMU terminated unexpectedly"; exit 1
          fi
          if grep -Eiq 'Debian GNU/Linux 13|Debian GNU/Linux trixie|Debian GNU/Linux.*trixie' boot.log; then
            echo "PASS: Debian 13 identification found in serial boot output (guest readiness not proven)"
            echo "- Debian 13 identification in serial output: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Guest login/application readiness: NOT VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: Debian 13 boot not confirmed"
            echo "- Debian 13 identification in serial output: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian13-tcg-boot-log
          path: |
            boot.log
            virtualization.log
          if-no-files-found: ignore
